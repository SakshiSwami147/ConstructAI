[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constructai"
version = "0.1.0"
description = "ConstructAI Flow Milestone 1 foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "PyMuPDF>=1.24,<2.0",
    "pydantic>=2.9,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
